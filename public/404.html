<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Denan Kids</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      @font-face {
        font-family: 'Trimen Drawing Demo';
        src: url('/fonts/Trimen Drawing Demo.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Antipasto';
        src: url('/fonts/Antipasto_regular.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Antipasto ExtraBold';
        src: url('/fonts/Antipasto_extrabold.otf') format('opentype');
        font-weight: 800;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --color-brand-primary: #d35097;
        --color-brand-primary-dark: #a63e74;
        --color-brand-primary-light: #f07fb8;
        --color-brand-secondary: #832c7a;
        --surface-container-low: #faf9f8;
        --text-secondary: #555555;
        --font-editorial: 'Trimen Drawing Demo', sans-serif;
        --font-sans: 'Antipasto', sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-sans), sans-serif;
        background-color: var(--surface-container-low);
        color: var(--color-brand-secondary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .logo-container {
        margin-bottom: 3rem;
      }

      .logo {
        height: 50px;
        width: auto;
      }

      .not-found__content {
        max-width: 550px;
        text-align: center;
        background: #ffffff;
        padding: 3rem 2.5rem;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(131, 44, 122, 0.04);
        border: 1px solid rgba(131, 44, 122, 0.05);
      }

      .not-found__code {
        font-family: var(--font-editorial);
        font-size: 6rem;
        line-height: 1;
        color: var(--color-brand-primary-light);
        margin-bottom: 1.5rem;
        opacity: 0.7;
      }

      .not-found__title {
        font-family: var(--font-editorial);
        font-size: 2.25rem;
        color: var(--color-brand-secondary);
        margin-bottom: 1rem;
        line-height: 1.2;
      }

      .not-found__description {
        font-size: 1.125rem;
        color: var(--text-secondary);
        margin-bottom: 2.5rem;
        line-height: 1.6;
      }

      .not-found__cta {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.875rem 2rem;
        font-family: var(--font-sans), sans-serif;
        font-size: 1.125rem;
        font-weight: 600;
        border-radius: 9999px;
        text-decoration: none;
        transition: all 0.2s ease-in-out;
        cursor: pointer;
      }

      .btn-primary {
        background-color: var(--color-brand-primary);
        color: #ffffff;
        border: 2px solid var(--color-brand-primary);
      }

      .btn-primary:hover {
        background-color: var(--color-brand-primary-dark);
        border-color: var(--color-brand-primary-dark);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(211, 80, 151, 0.2);
      }

      .btn-ghost {
        background-color: transparent;
        color: var(--color-brand-primary);
        border: 2px solid rgba(211, 80, 151, 0.2);
      }

      .btn-ghost:hover {
        background-color: rgba(211, 80, 151, 0.05);
        border-color: var(--color-brand-primary);
        transform: translateY(-2px);
      }

      @media (max-width: 640px) {
        body {
          padding: 1.5rem;
        }

        .not-found__content {
          padding: 2rem 1.5rem;
        }

        .not-found__code {
          font-size: 4.5rem;
        }

        .not-found__title {
          font-size: 1.75rem;
        }

        .not-found__cta {
          flex-direction: column;
          width: 100%;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
    <!-- X conversion tracking base code -->
    <script>
      !function(e,t,n,s,u,a){e.twq||(s=e.twq=function(){s.exe?s.exe.apply(s,arguments):s.queue.push(arguments);
      },s.version='1.1',s.queue=[],u=t.createElement(n),u.async=!0,u.src='https://static.ads-twitter.com/uwt.js',
      a=t.getElementsByTagName(n)[0],a.parentNode.insertBefore(u,a))}(window,document,'script');
      twq('config','re0vc');
    </script>
    <!-- End X conversion tracking base code -->
  </head>
  <body>
    <div class="logo-container">
      <a href="/">
        <img class="logo" src="/dennan_logo_final_compressed.png" alt="Denan Kids Logo" />
      </a>
    </div>

    <div class="not-found__content">
      <h1 class="not-found__code">404</h1>
      <h2 class="not-found__title">Oops! You've wandered off the trail.</h2>
      <p class="not-found__description">
        The page you're looking for doesn't exist or has been moved to a new home.
      </p>
      
      <div class="not-found__cta">
        <a href="/" class="btn btn-primary">Go back to the nursery</a>
        <a href="/category/all" class="btn btn-ghost">Browse all products</a>
      </div>
    </div>
  </body>
</html>
